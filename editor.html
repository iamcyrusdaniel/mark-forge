<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
</head>
    <body>
        <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
        <script src="main.js" type="module"></script>
        <header class="editorHeader">
            <div class="left">
                <img src="" alt="">
                <h1>Markdown Forge</h1>
            </div>
            <div class="right">
                <button id="shareButton"><img id="shareImage" src="./assets/share.png" alt=""></button>
                <button>Sign Up</button>
                <button>Log In</button>
            </div>
        </header>
        <main>
            <div id="prompt" class="hidden">
                <h2>Unsaved changes</h2>
                <p>You have unsaved changes from last time, would you like to restore it?</p>
                <div class="restoreButtons">
                    <button id="no">No</button>
                    <button id="yes">Restore</button>
                </div>
            </div>
            <div class="hidden" id="settingsMenu">
                <h2>Settings</h2>
                <div class="setting">
                    <div class="settingsDropdown">
                        <button class="settingsDropdownButton">hello</button>
                        <ul class="dropdown hidden">
                            <li class="selected">option 1</li>
                            <li>option 2</li>
                            <li>option 3</li>
                        </ul>
                    </div>
                    <div class="settingsDropdown">
                        <button class="settingsDropdownButton">hello</button>
                        <ul class="dropdown hidden">
                            <li class="selected">option 1</li>
                            <li>option 2</li>
                            <li>option 3</li>
                        </ul>
                    </div>
                </div>
                <button id="settingsClose">close</button>
            </div>
            <div class="horizontalContainer">
                <div id="lineCount"></div>
                <div class="left">
                    <button id="settingsButton"><img id="settingsImg" src="" alt=""></button>
                    <button id="settingsButton"><img id="settingsImg" src="/assets/settings.png" alt=""></button>
                    <textarea name="" id="editor" placeholder="hello"></textarea>
                </div>
                <div id="slider"></div>
                <div class="right">
                    <div id="background"></div>
                    <div id="preview"></div>
                <div id="content"></div>
            </div>
        </main>
    </body>
</html>
